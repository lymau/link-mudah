services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - ./backend:/src
    command: sh -c "go mod download && go run ./cmd/server"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-linkmudah}:${POSTGRES_PASSWORD:-linkmudah_dev}@postgres:5432/${POSTGRES_DB:-linkmudah}?sslmode=disable
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-linkmudah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkmudah}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmudah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkmudah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-linkmudah}
      PGPASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      PGDATABASE: ${POSTGRES_DB:-linkmudah}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations/000001_create_core_tables.up.sql:/migration.sql:ro
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /migration.sql"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules: