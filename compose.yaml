services:
  frontend:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-linkmudah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkmudah}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmudah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkmudah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-linkmudah}
      PGPASSWORD: ${POSTGRES_PASSWORD:-linkmudah_dev}
      PGDATABASE: ${POSTGRES_DB:-linkmudah}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations/000001_create_core_tables.up.sql:/migration.sql:ro
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /migration.sql"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: